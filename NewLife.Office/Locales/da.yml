"The certificate does not contain a usable RSA private key.": "Certifikatet indeholder ikke en brugbar RSA-privatnøgle."
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "PowerPoint-dokumentstreamen blev ikke fundet; filen er muligvis ikke en gyldig .ppt-fil."
