# Dansk 词表（da）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "Workbook-streamen blev ikke fundet; filen er muligvis ikke en gyldig xls-fil."
"BIFF8 Globals BOF record not found; the file may be corrupted.": "BIFF8 Globals BOF-post blev ikke fundet; filen er muligvis beskadiget."
"The range must be in A1:F1 format.": "Området skal være i formatet A1:F1."
"The rich-text segments cannot be empty.": "Rich-text-segmenterne må ikke være tomme."
"No output location was specified.": "Der blev ikke angivet en outputplacering."
"Source data has not been set; call SetSourceData() first.": "Kildedata er ikke angivet; kald SetSourceData() først."
"The stream content cannot be recognized or the format is not supported.": "Streamindholdet kan ikke genkendes, eller formatet understøttes ikke."
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "Gengivelse af PDF-sider som billeder kræver et gengivelsesbibliotek, som denne version ikke understøtter."
