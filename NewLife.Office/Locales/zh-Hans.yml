# 简体中文译文。键为英文源文，缺失时运行期回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "找不到 Workbook 流，文件可能不是有效的 xls 格式。"
"BIFF8 Globals BOF record not found; the file may be corrupted.": "未找到 BIFF8 Globals BOF 记录，文件可能损坏。"
"The range must be in A1:F1 format.": "范围格式应为 A1:F1"
"The rich-text segments cannot be empty.": "富文本段不能为空"
"No output location was specified.": "未指定输出位置"
"Source data has not been set; call SetSourceData() first.": "尚未设置源数据，请先调用 SetSourceData()"
"The stream content cannot be recognized or the format is not supported.": "无法识别流内容或格式不支持"
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "将 PDF 页面渲染为图片需要引入渲染库，当前版本不支持。"
"The signature field is missing the /Contents placeholder.": "签名字段缺少 /Contents 占位符"
"The /Contents placeholder is malformed.": "/Contents 占位符格式错误"
"The certificate does not contain a usable RSA private key.": "证书不包含可用的 RSA 私钥"
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "找不到 PowerPoint Document 流，文件可能不是有效的 .ppt 格式。"
