# Español 词表（es）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "No se encontró el flujo del libro; es posible que el archivo no sea un xls válido."
"BIFF8 Globals BOF record not found; the file may be corrupted.": "No se encontró el registro BIFF8 Globals BOF; es posible que el archivo esté dañado."
"The range must be in A1:F1 format.": "El rango debe tener el formato A1:F1."
"The rich-text segments cannot be empty.": "Los segmentos de texto enriquecido no pueden estar vacíos."
"No output location was specified.": "No se especificó ninguna ubicación de salida."
"Source data has not been set; call SetSourceData() first.": "No se han establecido los datos de origen; llame primero a SetSourceData()."
"The stream content cannot be recognized or the format is not supported.": "No se puede reconocer el contenido del flujo o el formato no es compatible."
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "La conversión de páginas PDF a imágenes requiere una biblioteca de renderizado, que esta versión no admite."
"The signature field is missing the /Contents placeholder.": "Al campo de firma le falta el marcador de posición /Contents."
"The /Contents placeholder is malformed.": "El marcador de posición /Contents tiene un formato incorrecto."
"The certificate does not contain a usable RSA private key.": "El certificado no contiene una clave privada RSA utilizable."
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "No se encontró el flujo de documento de PowerPoint; es posible que el archivo no sea un .ppt válido."
