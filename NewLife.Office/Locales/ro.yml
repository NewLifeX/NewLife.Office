# Română 词表（ro）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "Fluxul registrului de lucru nu a fost găsit; fișierul poate să nu fie un fișier xls valid."
"BIFF8 Globals BOF record not found; the file may be corrupted.": "Înregistrarea BIFF8 Globals BOF nu a fost găsită; fișierul poate fi corupt."
"The range must be in A1:F1 format.": "Intervalul trebuie să fie în formatul A1:F1."
"The rich-text segments cannot be empty.": "Segmentele de text formatat nu pot fi goale."
"No output location was specified.": "Nu a fost specificată o locație de ieșire."
"Source data has not been set; call SetSourceData() first.": "Datele sursă nu au fost setate; apelați mai întâi SetSourceData()."
"The stream content cannot be recognized or the format is not supported.": "Conținutul fluxului nu poate fi recunoscut sau formatul nu este acceptat."
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "Redarea paginilor PDF în imagini necesită o bibliotecă de redare, pe care această versiune nu o acceptă."
"The signature field is missing the /Contents placeholder.": "Câmpului de semnătură îi lipsește substituentul /Contents."
"The /Contents placeholder is malformed.": "Substituentul /Contents este invalid."
"The certificate does not contain a usable RSA private key.": "Certificatul nu conține o cheie privată RSA utilizabilă."
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "Fluxul documentului PowerPoint nu a fost găsit; fișierul poate să nu fie un fișier .ppt valid."
