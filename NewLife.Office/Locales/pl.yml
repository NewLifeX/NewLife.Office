"Slide {0} does not exist.": "Slajd {0} nie istnieje."
"WordDocument stream not found; the file may not be a valid .doc file.": "Nie znaleziono strumienia WordDocument; plik może nie być prawidłowym plikiem .doc."
"Unsupported document format: wIdent = 0x{0:X4}. Only Word 97-2003 binary format is supported.": "Nieobsługiwany format dokumentu: wIdent = 0x{0:X4}. Obsługiwany jest tylko binarny format Word 97-2003."
"The EncryptionInfo stream is missing from the CFB container.": "W kontenerze CFB brakuje strumienia EncryptionInfo."
"The EncryptedPackage stream is missing from the CFB container.": "W kontenerze CFB brakuje strumienia EncryptedPackage."
"The EncryptedPackage data is too short.": "Dane EncryptedPackage są zbyt krótkie."
"The password is incorrect or the document is corrupted.": "Hasło jest nieprawidłowe lub dokument jest uszkodzony."
"The EncryptionInfo data is too short.": "Dane EncryptionInfo są zbyt krótkie."
"The XML declaration is missing from EncryptionInfo.": "W EncryptionInfo brakuje deklaracji XML."
"saltValue is missing from EncryptionInfo.": "W EncryptionInfo brakuje saltValue."
"The saltValue format in EncryptionInfo is invalid.": "Format saltValue w EncryptionInfo jest nieprawidłowy."
"Invalid docx file: word/document.xml is missing.": "Nieprawidłowy plik docx: brakuje word/document.xml."
"Unsupported file format: {0}": "Nieobsługiwany format pliku: {0}"
