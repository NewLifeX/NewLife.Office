# Polski 词表（pl）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "Nie znaleziono strumienia skoroszytu; plik może nie być prawidłowym plikiem xls."
"BIFF8 Globals BOF record not found; the file may be corrupted.": "Nie znaleziono rekordu BIFF8 Globals BOF; plik może być uszkodzony."
"The range must be in A1:F1 format.": "Zakres musi mieć format A1:F1."
"The rich-text segments cannot be empty.": "Segmenty tekstu sformatowanego nie mogą być puste."
"No output location was specified.": "Nie określono lokalizacji wyjściowej."
"Source data has not been set; call SetSourceData() first.": "Dane źródłowe nie zostały ustawione; najpierw wywołaj SetSourceData()."
"The stream content cannot be recognized or the format is not supported.": "Zawartość strumienia nie może zostać rozpoznana lub format nie jest obsługiwany."
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "Renderowanie stron PDF do obrazów wymaga biblioteki renderującej, której ta wersja nie obsługuje."
"The signature field is missing the /Contents placeholder.": "W polu podpisu brakuje symbolu zastępczego /Contents."
"The /Contents placeholder is malformed.": "Symbol zastępczy /Contents ma nieprawidłowy format."
"The certificate does not contain a usable RSA private key.": "Certyfikat nie zawiera użytecznego klucza prywatnego RSA."
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "Nie znaleziono strumienia dokumentu PowerPoint; plik może nie być prawidłowym plikiem .ppt."
# 以下为新增运行时消息；暂以英文回退，待增量翻译。
"File not found: {0}": "Nie znaleziono pliku: {0}"
"The stream content cannot be recognized or the format is not supported: {0}": "Nie można rozpoznać zawartości strumienia lub format nie jest obsługiwany: {0}"
"The text is too long ({0} bytes); the maximum is 106 bytes. Please shorten the text.": "Tekst jest zbyt długi ({0} bajtów); maksimum to 106 bajtów. Skróć tekst."
"Signature field '{0}' was not found.": "Nie znaleziono pola podpisu „{0}”."
