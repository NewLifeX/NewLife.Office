"The number of persisted objects {0} exceeds the per-block persistence directory limit of 4095.": "Liczba utrwalonych obiektów {0} przekracza limit 4095 katalogu trwałości na blok."
"Image index {0} is out of range (total {1} images).": "Indeks obrazu {0} jest poza zakresem (łącznie {1} obrazów)."
"Slide {0} does not exist in the source file.": "Slajd {0} nie istnieje w pliku źródłowym."
