# Suomi 词表（fi）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "Työkirjan virtaa ei löytynyt; tiedosto ei ehkä ole kelvollinen xls-tiedosto."
"BIFF8 Globals BOF record not found; the file may be corrupted.": "BIFF8 Globals BOF -tietuetta ei löytynyt; tiedosto voi olla vioittunut."
"The range must be in A1:F1 format.": "Alueen on oltava muodossa A1:F1."
"The rich-text segments cannot be empty.": "Rich-tekstin osat eivät voi olla tyhjiä."
"No output location was specified.": "Tulosteen sijaintia ei määritetty."
"Source data has not been set; call SetSourceData() first.": "Lähdetietoja ei ole asetettu; kutsu ensin SetSourceData()."
"The stream content cannot be recognized or the format is not supported.": "Virran sisältöä ei tunnisteta tai muotoa ei tueta."
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "PDF-sivujen hahmontaminen kuviksi vaatii hahmontamiskirjaston, jota tämä versio ei tue."
"The signature field is missing the /Contents placeholder.": "Allekirjoituskentästä puuttuu /Contents-paikkamerkki."
"The /Contents placeholder is malformed.": "/Contents-paikkamerkki on virheellinen."
"The certificate does not contain a usable RSA private key.": "Varmenne ei sisällä käyttökelpoista RSA-yksityisavainta."
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "PowerPoint-asiakirjan virtaa ei löytynyt; tiedosto ei ehkä ole kelvollinen .ppt-tiedosto."
