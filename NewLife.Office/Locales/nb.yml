"The /Contents placeholder is malformed.": "/Contents-plassholderen er ugyldig."
"The certificate does not contain a usable RSA private key.": "Sertifikatet inneholder ikke en brukbar RSA-privatnøkkel."
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "PowerPoint-dokumentstrømmen ble ikke funnet; filen er kanskje ikke en gyldig .ppt-fil."
