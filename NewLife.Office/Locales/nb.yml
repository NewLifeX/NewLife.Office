"BIFF8 Globals BOF record not found; the file may be corrupted.": "BIFF8 Globals BOF-posten ble ikke funnet; filen kan være skadet."
"The range must be in A1:F1 format.": "Området må være i formatet A1:F1."
"The rich-text segments cannot be empty.": "Rich-text-segmentene kan ikke være tomme."
"No output location was specified.": "Det ble ikke angitt noen utdataplassering."
"Source data has not been set; call SetSourceData() first.": "Kildedata er ikke angitt; kall SetSourceData() først."
"The stream content cannot be recognized or the format is not supported.": "Strømmens innhold kan ikke gjenkjennes, eller formatet støttes ikke."
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "Gjengivelse av PDF-sider som bilder krever et gjengivelsesbibliotek, som denne versjonen ikke støtter."
