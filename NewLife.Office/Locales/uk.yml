# Українська 词表（uk）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "Потік робочої книги не знайдено; можливо, файл не є дійсним файлом xls."
"BIFF8 Globals BOF record not found; the file may be corrupted.": "Запис BIFF8 Globals BOF не знайдено; можливо, файл пошкоджено."
"The range must be in A1:F1 format.": "Діапазон має бути у форматі A1:F1."
"The rich-text segments cannot be empty.": "Сегменти форматованого тексту не можуть бути порожніми."
"No output location was specified.": "Не вказано місце виведення."
"Source data has not been set; call SetSourceData() first.": "Вихідні дані не встановлено; спочатку викличте SetSourceData()."
"The stream content cannot be recognized or the format is not supported.": "Вміст потоку не розпізнається або формат не підтримується."
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "Для перетворення сторінок PDF на зображення потрібна бібліотека рендерингу, яку ця версія не підтримує."
"The signature field is missing the /Contents placeholder.": "У полі підпису відсутній заповнювач /Contents."
"The /Contents placeholder is malformed.": "Заповнювач /Contents має неправильний формат."
"The certificate does not contain a usable RSA private key.": "Сертифікат не містить придатного закритого ключа RSA."
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "Потік документа PowerPoint не знайдено; можливо, файл не є дійсним файлом .ppt."
# 以下为新增运行时消息；暂以英文回退，待增量翻译。
