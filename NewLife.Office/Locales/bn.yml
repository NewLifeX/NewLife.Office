# বাংলা 词表（bn）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "ওয়ার্কবুক স্ট্রিম পাওয়া যায়নি; ফাইলটি বৈধ xls ফাইল নাও হতে পারে।"
"BIFF8 Globals BOF record not found; the file may be corrupted.": "BIFF8 Globals BOF রেকর্ড পাওয়া যায়নি; ফাইলটি ক্ষতিগ্রস্ত হতে পারে।"
"The range must be in A1:F1 format.": "পরিসরটি A1:F1 বিন্যাসে হতে হবে।"
"The rich-text segments cannot be empty.": "রিচ-টেক্সট অংশগুলি খালি হতে পারে না।"
"No output location was specified.": "কোনও আউটপুট অবস্থান নির্দিষ্ট করা হয়নি।"
"Source data has not been set; call SetSourceData() first.": "উৎস ডেটা সেট করা হয়নি; প্রথমে SetSourceData() কল করুন।"
"The stream content cannot be recognized or the format is not supported.": "স্ট্রিমের বিষয়বস্তু শনাক্ত করা যায় না বা বিন্যাসটি সমর্থিত নয়।"
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "PDF পৃষ্ঠাগুলিকে চিত্রে রেন্ডার করতে একটি রেন্ডারিং লাইব্রেরি প্রয়োজন, যা এই সংস্করণে সমর্থিত নয়।"
"The signature field is missing the /Contents placeholder.": "স্বাক্ষর ক্ষেত্রে /Contents প্লেসহোল্ডার অনুপস্থিত।"
"The /Contents placeholder is malformed.": "/Contents প্লেসহোল্ডারটি ত্রুটিপূর্ণ।"
"The certificate does not contain a usable RSA private key.": "সার্টিফিকেটে ব্যবহারযোগ্য RSA প্রাইভেট কী নেই।"
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "PowerPoint Document স্ট্রিম পাওয়া যায়নি; ফাইলটি বৈধ .ppt ফাইল নাও হতে পারে।"
