# עברית 词表（he）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "זרם חוברת העבודה לא נמצא; ייתכן שהקובץ אינו קובץ xls חוקי."
"BIFF8 Globals BOF record not found; the file may be corrupted.": "רשומת BIFF8 Globals BOF לא נמצאה; ייתכן שהקובץ פגום."
"The range must be in A1:F1 format.": "הטווח חייב להיות בפורמט A1:F1."
"The rich-text segments cannot be empty.": "מקטעי הטקסט העשיר לא יכולים להיות ריקים."
"No output location was specified.": "לא צוין מיקום פלט."
"Source data has not been set; call SetSourceData() first.": "נתוני המקור לא הוגדרו; יש לקרוא תחילה ל-SetSourceData()."
"The stream content cannot be recognized or the format is not supported.": "לא ניתן לזהות את תוכן הזרם או שהפורמט אינו נתמך."
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "עיבוד עמודי PDF לתמונות דורש ספריית עיבוד, שאינה נתמכת בגרסה זו."
"The signature field is missing the /Contents placeholder.": "בשדה החתימה חסר מציין המקום /Contents."
"The /Contents placeholder is malformed.": "מציין המקום /Contents פגום."
"The certificate does not contain a usable RSA private key.": "התעודה אינה מכילה מפתח פרטי RSA שמיש."
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "זרם מסמך PowerPoint לא נמצא; ייתכן שהקובץ אינו קובץ .ppt חוקי."
