"NewLife.Office CLI tool": "NewLife.Office CLI ツール"
"Usage:": "使用方法:"
"  convert <input> [output]   Convert office documents to Markdown (output defaults to stdout)": "  convert <input> [output]   Office ドキュメントを Markdown に変換（出力は既定で stdout）"
"  doc2docx <in.doc> <out.docx>   Convert doc (97-2003) to docx (W20)": "  doc2docx <in.doc> <out.docx>   doc (97-2003) を docx (W20) に変換"
"  info <input>               Show file format information": "  info <input>               ファイル形式の情報を表示"
"Supported formats: docx/xlsx/pptx/pdf/md/ods/rtf/epub, etc.": "サポート形式: docx/xlsx/pptx/pdf/md/ods/rtf/epub など"
"Unable to find worksheet": "ワークシートが見つかりません"
"Stream must be seekable.": "ストリームはシーク可能である必要があります。"
"Not a valid CFB file: magic number mismatch.": "無効な CFB ファイルです: マジック ナンバーが一致しません。"
"Unexpected end of CFB stream.": "CFB ストリームの予期しない終了です。"
"Rendering to images requires a rendering library such as SkiaSharp, which this version does not support. Convert to PDF first, then use PdfDocument.RenderToImages.": "画像へのレンダリングには SkiaSharp などのレンダリング ライブラリが必要ですが、このバージョンではサポートされていません。先に PDF に変換してから、PdfDocument.RenderToImages を使用してください。"
