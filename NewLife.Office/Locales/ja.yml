# 日本語 词表（ja）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "ワークブック ストリームが見つかりません。有効な xls ファイルではない可能性があります。"
"BIFF8 Globals BOF record not found; the file may be corrupted.": "BIFF8 Globals BOF レコードが見つかりません。ファイルが破損している可能性があります。"
"The range must be in A1:F1 format.": "範囲は A1:F1 形式で指定する必要があります。"
"The rich-text segments cannot be empty.": "リッチテキストのセグメントは空にできません。"
"No output location was specified.": "出力場所が指定されていません。"
"Source data has not been set; call SetSourceData() first.": "ソース データが設定されていません。先に SetSourceData() を呼び出してください。"
"The stream content cannot be recognized or the format is not supported.": "ストリームの内容を認識できないか、形式がサポートされていません。"
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "PDF ページを画像にレンダリングするにはレンダリング ライブラリが必要ですが、このバージョンではサポートされていません。"
"The signature field is missing the /Contents placeholder.": "署名フィールドに /Contents プレースホルダーがありません。"
"The /Contents placeholder is malformed.": "/Contents プレースホルダーの形式が正しくありません。"
"The certificate does not contain a usable RSA private key.": "証明書に使用可能な RSA 秘密キーが含まれていません。"
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "PowerPoint ドキュメント ストリームが見つかりません。有効な .ppt ファイルではない可能性があります。"
# 以下为新增运行时消息；暂以英文回退，待增量翻译。
"File not found: {0}": "ファイルが見つかりません: {0}"
"The stream content cannot be recognized or the format is not supported: {0}": "ストリームの内容を認識できないか、形式がサポートされていません: {0}"
"The text is too long ({0} bytes); the maximum is 106 bytes. Please shorten the text.": "テキストが長すぎます（{0} バイト）。最大 106 バイトです。テキストを短くしてください。"
"Signature field '{0}' was not found.": "署名フィールド「{0}」が見つかりませんでした。"
"Signature length {0} exceeds the reserved {1} characters.": "署名の長さ {0} が予約された {1} 文字を超えています。"
"Slide index {0} is out of range (total {1} slides).": "スライド インデックス {0} が範囲外です（スライド総数 {1}）。"
"The number of persisted objects {0} exceeds the per-block persistence directory limit of 4095.": "永続化オブジェクト数 {0} がブロックあたりの永続化ディレクトリ上限 4095 を超えています。"
"Image index {0} is out of range (total {1} images).": "画像インデックス {0} が範囲外です（画像総数 {1}）。"
"Slide {0} does not exist in the source file.": "スライド {0} はソース ファイルに存在しません。"
"The encrypted PPTX requires an open password.": "暗号化された PPTX には開くためのパスワードが必要です。"
"Slide {0} does not exist.": "スライド {0} は存在しません。"
"WordDocument stream not found; the file may not be a valid .doc file.": "WordDocument ストリームが見つかりません。有効な .doc ファイルではない可能性があります。"
"Unsupported document format: wIdent = 0x{0:X4}. Only Word 97-2003 binary format is supported.": "サポートされていないドキュメント形式です: wIdent = 0x{0:X4}。Word 97-2003 バイナリ形式のみサポートされています。"
"The EncryptionInfo stream is missing from the CFB container.": "CFB コンテナーに EncryptionInfo ストリームがありません。"
"The EncryptedPackage stream is missing from the CFB container.": "CFB コンテナーに EncryptedPackage ストリームがありません。"
"The EncryptedPackage data is too short.": "EncryptedPackage データが短すぎます。"
"The password is incorrect or the document is corrupted.": "パスワードが間違っているか、ドキュメントが破損しています。"
"The EncryptionInfo data is too short.": "EncryptionInfo データが短すぎます。"
"The XML declaration is missing from EncryptionInfo.": "EncryptionInfo に XML 宣言がありません。"
"saltValue is missing from EncryptionInfo.": "EncryptionInfo に saltValue がありません。"
"The saltValue format in EncryptionInfo is invalid.": "EncryptionInfo の saltValue 形式が無効です。"
"Invalid docx file: word/document.xml is missing.": "無効な docx ファイルです: word/document.xml がありません。"
"Unsupported file format: {0}": "サポートされていないファイル形式です: {0}"
"Scaling failed.": "スケーリングに失敗しました。"
"Unable to decode the image data.": "画像データをデコードできませんでした。"
"Invalid image dimensions.": "画像のサイズが無効です。"
"Failed to generate the QR code.": "QR コードの生成に失敗しました。"
"Page index {0} is out of range [0, {1}].": "ページ インデックス {0} が範囲 [0, {1}] 外です。"
"Failed to convert Word to PDF.": "Word から PDF への変換に失敗しました。"
"Error: {0}": "エラー: {0}"
"Usage: convert <input> [output]": "使用方法: convert <input> [output]"
