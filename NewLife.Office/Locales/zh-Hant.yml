# 繁體中文譯文。鍵為英文源文，缺失時執行期回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "找不到 Workbook 流，文件可能不是有效的 xls 格式。"
"BIFF8 Globals BOF record not found; the file may be corrupted.": "未找到 BIFF8 Globals BOF 記錄，文件可能損壞。"
"The range must be in A1:F1 format.": "範圍格式應為 A1:F1"
"The rich-text segments cannot be empty.": "富文本段不能為空"
"No output location was specified.": "未指定輸出位置"
"Source data has not been set; call SetSourceData() first.": "尚未設置源數據，請先調用 SetSourceData()"
"The stream content cannot be recognized or the format is not supported.": "無法識別流內容或格式不支持"
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "將 PDF 頁面渲染為圖片需要引入渲染庫，當前版本不支持。"
"The signature field is missing the /Contents placeholder.": "簽名字段缺少 /Contents 佔位符"
"The /Contents placeholder is malformed.": "/Contents 佔位符格式錯誤"
"The certificate does not contain a usable RSA private key.": "證書不包含可用的 RSA 私鑰"
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "找不到 PowerPoint Document 流，文件可能不是有效的 .ppt 格式。"
