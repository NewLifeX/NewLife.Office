# Ελληνικά 词表（el）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "Η ροή του βιβλίου εργασίας δεν βρέθηκε. Το αρχείο ενδέχεται να μην είναι έγκυρο αρχείο xls."
"BIFF8 Globals BOF record not found; the file may be corrupted.": "Η εγγραφή BIFF8 Globals BOF δεν βρέθηκε. Το αρχείο ενδέχεται να είναι κατεστραμμένο."
"The range must be in A1:F1 format.": "Το εύρος πρέπει να είναι στη μορφή A1:F1."
"The rich-text segments cannot be empty.": "Τα τμήματα εμπλουτισμένου κειμένου δεν μπορούν να είναι κενά."
"No output location was specified.": "Δεν καθορίστηκε τοποθεσία εξόδου."
"Source data has not been set; call SetSourceData() first.": "Τα δεδομένα προέλευσης δεν έχουν οριστεί. Καλέστε πρώτα το SetSourceData()."
"The stream content cannot be recognized or the format is not supported.": "Το περιεχόμενο της ροής δεν αναγνωρίζεται ή η μορφή δεν υποστηρίζεται."
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "Η απόδοση σελίδων PDF σε εικόνες απαιτεί βιβλιοθήκη απόδοσης, την οποία δεν υποστηρίζει αυτή η έκδοση."
"The signature field is missing the /Contents placeholder.": "Το πεδίο υπογραφής δεν έχει το σύμβολο κράτησης θέσης /Contents."
"The /Contents placeholder is malformed.": "Το σύμβολο κράτησης θέσης /Contents έχει εσφαλμένη μορφή."
"The certificate does not contain a usable RSA private key.": "Το πιστοποιητικό δεν περιέχει χρησιμοποιήσιμο ιδιωτικό κλειδί RSA."
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "Η ροή εγγράφου PowerPoint δεν βρέθηκε. Το αρχείο ενδέχεται να μην είναι έγκυρο αρχείο .ppt."
# 以下为新增运行时消息；暂以英文回退，待增量翻译。
"File not found: {0}": "Το αρχείο δεν βρέθηκε: {0}"
"The stream content cannot be recognized or the format is not supported: {0}": "Το περιεχόμενο της ροής δεν αναγνωρίστηκε ή η μορφή δεν υποστηρίζεται: {0}"
"The text is too long ({0} bytes); the maximum is 106 bytes. Please shorten the text.": "Το κείμενο είναι πολύ μεγάλο ({0} byte); το μέγιστο είναι 106 byte. Συντομεύστε το κείμενο."
"Signature field '{0}' was not found.": "Το πεδίο υπογραφής «{0}» δεν βρέθηκε."
"Signature length {0} exceeds the reserved {1} characters.": "Το μήκος της υπογραφής {0} υπερβαίνει τους δεσμευμένους {1} χαρακτήρες."
"Slide index {0} is out of range (total {1} slides).": "Το ευρετήριο διαφάνειας {0} είναι εκτός εύρους (σύνολο {1} διαφάνειες)."
"The number of persisted objects {0} exceeds the per-block persistence directory limit of 4095.": "Ο αριθμός των μόνιμων αντικειμένων {0} υπερβαίνει το όριο 4095 του καταλόγου μονιμότητας ανά μπλοκ."
"Image index {0} is out of range (total {1} images).": "Το ευρετήριο εικόνας {0} είναι εκτός εύρους (σύνολο {1} εικόνες)."
"Slide {0} does not exist in the source file.": "Η διαφάνεια {0} δεν υπάρχει στο αρχείο προέλευσης."
"The encrypted PPTX requires an open password.": "Το κρυπτογραφημένο PPTX απαιτεί κωδικό πρόσβασης ανοίγματος."
"Slide {0} does not exist.": "Η διαφάνεια {0} δεν υπάρχει."
"WordDocument stream not found; the file may not be a valid .doc file.": "Η ροή WordDocument δεν βρέθηκε· το αρχείο μπορεί να μην είναι έγκυρο .doc."
"Unsupported document format: wIdent = 0x{0:X4}. Only Word 97-2003 binary format is supported.": "Μη υποστηριζόμενη μορφή εγγράφου: wIdent = 0x{0:X4}. Υποστηρίζεται μόνο η δυαδική μορφή Word 97-2003."
"The EncryptionInfo stream is missing from the CFB container.": "Η ροή EncryptionInfo λείπει από το κοντέινερ CFB."
"The EncryptedPackage stream is missing from the CFB container.": "Η ροή EncryptedPackage λείπει από το κοντέινερ CFB."
"The EncryptedPackage data is too short.": "Τα δεδομένα EncryptedPackage είναι πολύ σύντομα."
"The password is incorrect or the document is corrupted.": "Ο κωδικός πρόσβασης είναι λανθασμένος ή το έγγραφο είναι κατεστραμμένο."
"The EncryptionInfo data is too short.": "Τα δεδομένα EncryptionInfo είναι πολύ σύντομα."
"The XML declaration is missing from EncryptionInfo.": "Η δήλωση XML λείπει από το EncryptionInfo."
"saltValue is missing from EncryptionInfo.": "Το saltValue λείπει από το EncryptionInfo."
"The saltValue format in EncryptionInfo is invalid.": "Η μορφή saltValue στο EncryptionInfo δεν είναι έγκυρη."
"Invalid docx file: word/document.xml is missing.": "Μη έγκυρο αρχείο docx: λείπει το word/document.xml."
"Unsupported file format: {0}": "Μη υποστηριζόμενη μορφή αρχείου: {0}"
"Scaling failed.": "Η κλιμάκωση απέτυχε."
"Unable to decode the image data.": "Δεν ήταν δυνατή η αποκωδικοποίηση των δεδομένων εικόνας."
"Invalid image dimensions.": "Μη έγκυρες διαστάσεις εικόνας."
"Failed to generate the QR code.": "Αποτυχία δημιουργίας του κωδικού QR."
"Page index {0} is out of range [0, {1}].": "Το ευρετήριο σελίδας {0} είναι εκτός εύρους [0, {1}]."
