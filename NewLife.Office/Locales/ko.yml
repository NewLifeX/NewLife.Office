# 한국어 词表（ko）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "통합 문서 스트림을 찾을 수 없습니다. 유효한 xls 파일이 아닐 수 있습니다."
"BIFF8 Globals BOF record not found; the file may be corrupted.": "BIFF8 Globals BOF 레코드를 찾을 수 없습니다. 파일이 손상되었을 수 있습니다."
"The range must be in A1:F1 format.": "범위는 A1:F1 형식이어야 합니다."
"The rich-text segments cannot be empty.": "서식 있는 텍스트 세그먼트는 비워 둘 수 없습니다."
"No output location was specified.": "출력 위치가 지정되지 않았습니다."
"Source data has not been set; call SetSourceData() first.": "원본 데이터가 설정되지 않았습니다. 먼저 SetSourceData()를 호출하세요."
"The stream content cannot be recognized or the format is not supported.": "스트림 내용을 인식할 수 없거나 형식이 지원되지 않습니다."
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "PDF 페이지를 이미지로 렌더링하려면 렌더링 라이브러리가 필요하지만 이 버전에서는 지원되지 않습니다."
"The signature field is missing the /Contents placeholder.": "서명 필드에 /Contents 자리 표시자가 없습니다."
"The /Contents placeholder is malformed.": "/Contents 자리 표시자의 형식이 잘못되었습니다."
"The certificate does not contain a usable RSA private key.": "인증서에 사용 가능한 RSA 개인 키가 없습니다."
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "PowerPoint 문서 스트림을 찾을 수 없습니다. 유효한 .ppt 파일이 아닐 수 있습니다."
# 以下为新增运行时消息；暂以英文回退，待增量翻译。
"File not found: {0}": "파일을 찾을 수 없습니다: {0}"
"The stream content cannot be recognized or the format is not supported: {0}": "스트림 내용을 인식할 수 없거나 형식이 지원되지 않습니다: {0}"
"The text is too long ({0} bytes); the maximum is 106 bytes. Please shorten the text.": "텍스트가 너무 깁니다({0}바이트). 최대 106바이트입니다. 텍스트를 줄여 주세요."
"Signature field '{0}' was not found.": "서명 필드 '{0}'을(를) 찾을 수 없습니다."
"Signature length {0} exceeds the reserved {1} characters.": "서명 길이 {0}이(가) 예약된 {1}자를 초과합니다."
"Slide index {0} is out of range (total {1} slides).": "슬라이드 인덱스 {0}이(가) 범위를 벗어났습니다(전체 {1}개 슬라이드)."
"The number of persisted objects {0} exceeds the per-block persistence directory limit of 4095.": "유지 개체 수 {0}이(가) 블록당 유지 디렉터리 제한 4095를 초과합니다."
"Image index {0} is out of range (total {1} images).": "이미지 인덱스 {0}이(가) 범위를 벗어났습니다(전체 {1}개 이미지)."
"Slide {0} does not exist in the source file.": "슬라이드 {0}이(가) 원본 파일에 없습니다."
"The encrypted PPTX requires an open password.": "암호화된 PPTX에는 열기 암호가 필요합니다."
"Slide {0} does not exist.": "슬라이드 {0}이(가) 없습니다."
"WordDocument stream not found; the file may not be a valid .doc file.": "WordDocument 스트림을 찾을 수 없습니다. 유효한 .doc 파일이 아닐 수 있습니다."
"Unsupported document format: wIdent = 0x{0:X4}. Only Word 97-2003 binary format is supported.": "지원되지 않는 문서 형식입니다: wIdent = 0x{0:X4}. Word 97-2003 이진 형식만 지원됩니다."
"The EncryptionInfo stream is missing from the CFB container.": "CFB 컨테이너에 EncryptionInfo 스트림이 없습니다."
"The EncryptedPackage stream is missing from the CFB container.": "CFB 컨테이너에 EncryptedPackage 스트림이 없습니다."
"The EncryptedPackage data is too short.": "EncryptedPackage 데이터가 너무 짧습니다."
"The password is incorrect or the document is corrupted.": "암호가 잘못되었거나 문서가 손상되었습니다."
"The EncryptionInfo data is too short.": "EncryptionInfo 데이터가 너무 짧습니다."
"The XML declaration is missing from EncryptionInfo.": "EncryptionInfo에 XML 선언이 없습니다."
"saltValue is missing from EncryptionInfo.": "EncryptionInfo에 saltValue가 없습니다."
"The saltValue format in EncryptionInfo is invalid.": "EncryptionInfo의 saltValue 형식이 잘못되었습니다."
"Invalid docx file: word/document.xml is missing.": "잘못된 docx 파일입니다: word/document.xml이 없습니다."
"Unsupported file format: {0}": "지원되지 않는 파일 형식입니다: {0}"
