# Português 词表（pt）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "Fluxo de pasta de trabalho não encontrado; o arquivo pode não ser um xls válido."
"BIFF8 Globals BOF record not found; the file may be corrupted.": "Registro BIFF8 Globals BOF não encontrado; o arquivo pode estar corrompido."
"The range must be in A1:F1 format.": "O intervalo deve estar no formato A1:F1."
"The rich-text segments cannot be empty.": "Os segmentos de texto rico não podem estar vazios."
"No output location was specified.": "Nenhum local de saída foi especificado."
"Source data has not been set; call SetSourceData() first.": "Os dados de origem não foram definidos; chame SetSourceData() primeiro."
"The stream content cannot be recognized or the format is not supported.": "O conteúdo do fluxo não pode ser reconhecido ou o formato não é suportado."
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "Renderizar páginas PDF em imagens requer uma biblioteca de renderização, que esta versão não suporta."
"The signature field is missing the /Contents placeholder.": "O campo de assinatura não tem o espaço reservado /Contents."
"The /Contents placeholder is malformed.": "O espaço reservado /Contents está malformado."
"The certificate does not contain a usable RSA private key.": "O certificado não contém uma chave privada RSA utilizável."
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "Fluxo de documento do PowerPoint não encontrado; o arquivo pode não ser um .ppt válido."
