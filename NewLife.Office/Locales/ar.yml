# العربية 词表（ar）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "لم يتم العثور على تدفق المصنف؛ قد لا يكون الملف ملف xls صالحًا."
"BIFF8 Globals BOF record not found; the file may be corrupted.": "لم يتم العثور على سجل BIFF8 Globals BOF؛ قد يكون الملف تالفًا."
"The range must be in A1:F1 format.": "يجب أن يكون النطاق بصيغة A1:F1."
"The rich-text segments cannot be empty.": "لا يمكن أن تكون مقاطع النص المنسق فارغة."
"No output location was specified.": "لم يتم تحديد موقع إخراج."
"Source data has not been set; call SetSourceData() first.": "لم يتم تعيين بيانات المصدر؛ استدعِ SetSourceData() أولًا."
"The stream content cannot be recognized or the format is not supported.": "تعذّر التعرف على محتوى التدفق أو أن التنسيق غير مدعوم."
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "يتطلب تحويل صفحات PDF إلى صور مكتبة عرض، وهو ما لا يدعمه هذا الإصدار."
"The signature field is missing the /Contents placeholder.": "يفتقد حقل التوقيع العنصر النائب /Contents."
"The /Contents placeholder is malformed.": "العنصر النائب /Contents غير صالح."
"The certificate does not contain a usable RSA private key.": "لا تحتوي الشهادة على مفتاح RSA خاص قابل للاستخدام."
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "لم يتم العثور على تدفق مستند PowerPoint؛ قد لا يكون الملف ملف .ppt صالحًا."
# 以下为新增运行时消息；暂以英文回退，待增量翻译。
"File not found: {0}": "الملف غير موجود: {0}"
"The stream content cannot be recognized or the format is not supported: {0}": "تعذّر التعرف على محتوى التدفق أو أن التنسيق غير مدعوم: {0}"
"The text is too long ({0} bytes); the maximum is 106 bytes. Please shorten the text.": "النص طويل جدًا ({0} بايت)؛ الحد الأقصى هو 106 بايت. يرجى تقصير النص."
"Signature field '{0}' was not found.": "لم يتم العثور على حقل التوقيع «{0}»."
"Signature length {0} exceeds the reserved {1} characters.": "يتجاوز طول التوقيع {0} العدد المحجوز البالغ {1} حرفًا."
"Slide index {0} is out of range (total {1} slides).": "فهرس الشريحة {0} خارج النطاق (إجمالي {1} شريحة)."
"The number of persisted objects {0} exceeds the per-block persistence directory limit of 4095.": "يتجاوز عدد الكائنات المحفوظة {0} حد 4095 لدليل الاستمرارية لكل كتلة."
"Image index {0} is out of range (total {1} images).": "فهرس الصورة {0} خارج النطاق (إجمالي {1} صورة)."
"Slide {0} does not exist in the source file.": "الشريحة {0} غير موجودة في الملف المصدر."
"The encrypted PPTX requires an open password.": "يتطلب ملف PPTX المشفر كلمة مرور للفتح."
"Slide {0} does not exist.": "الشريحة {0} غير موجودة."
"WordDocument stream not found; the file may not be a valid .doc file.": "لم يتم العثور على تدفق WordDocument؛ قد لا يكون الملف ملف .doc صالحًا."
"Unsupported document format: wIdent = 0x{0:X4}. Only Word 97-2003 binary format is supported.": "تنسيق مستند غير مدعوم: wIdent = 0x{0:X4}. يتم دعم تنسيق Word 97-2003 الثنائي فقط."
"The EncryptionInfo stream is missing from the CFB container.": "تدفق EncryptionInfo مفقود من حاوية CFB."
"The EncryptedPackage stream is missing from the CFB container.": "تدفق EncryptedPackage مفقود من حاوية CFB."
"The EncryptedPackage data is too short.": "بيانات EncryptedPackage قصيرة جدًا."
"The password is incorrect or the document is corrupted.": "كلمة المرور غير صحيحة أو المستند تالف."
"The EncryptionInfo data is too short.": "بيانات EncryptionInfo قصيرة جدًا."
"The XML declaration is missing from EncryptionInfo.": "إعلان XML مفقود من EncryptionInfo."
"saltValue is missing from EncryptionInfo.": "saltValue مفقود من EncryptionInfo."
"The saltValue format in EncryptionInfo is invalid.": "تنسيق saltValue في EncryptionInfo غير صالح."
"Invalid docx file: word/document.xml is missing.": "ملف docx غير صالح: word/document.xml مفقود."
"Unsupported file format: {0}": "تنسيق ملف غير مدعوم: {0}"
