# Türkçe 词表（tr）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "Çalışma kitabı akışı bulunamadı; dosya geçerli bir xls dosyası olmayabilir."
"BIFF8 Globals BOF record not found; the file may be corrupted.": "BIFF8 Globals BOF kaydı bulunamadı; dosya bozulmuş olabilir."
"The range must be in A1:F1 format.": "Aralık A1:F1 biçiminde olmalıdır."
"The rich-text segments cannot be empty.": "Zengin metin segmentleri boş olamaz."
"No output location was specified.": "Çıktı konumu belirtilmedi."
"Source data has not been set; call SetSourceData() first.": "Kaynak veriler ayarlanmadı; önce SetSourceData() öğesini çağırın."
"The stream content cannot be recognized or the format is not supported.": "Akış içeriği tanınamıyor veya biçim desteklenmiyor."
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "PDF sayfalarını görüntülere dönüştürmek, bu sürümün desteklemediği bir işleme kitaplığı gerektirir."
"The signature field is missing the /Contents placeholder.": "İmza alanında /Contents yer tutucusu eksik."
"The /Contents placeholder is malformed.": "/Contents yer tutucusu hatalı biçimde."
"The certificate does not contain a usable RSA private key.": "Sertifika kullanılabilir bir RSA özel anahtarı içermiyor."
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "PowerPoint belge akışı bulunamadı; dosya geçerli bir .ppt dosyası olmayabilir."
