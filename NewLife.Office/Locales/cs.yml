"Workbook stream not found; the file may not be a valid xls file.": "Stream sešitu nebyl nalezen; soubor možná není platný soubor xls."
"BIFF8 Globals BOF record not found; the file may be corrupted.": "Záznam BIFF8 Globals BOF nebyl nalezen; soubor může být poškozený."
"The range must be in A1:F1 format.": "Rozsah musí být ve formátu A1:F1."
"The rich-text segments cannot be empty.": "Segmenty formátovaného textu nesmí být prázdné."
"No output location was specified.": "Nebylo určeno místo výstupu."
