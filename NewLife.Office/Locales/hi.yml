# हिन्दी 词表（hi）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "वर्कबुक स्ट्रीम नहीं मिली; हो सकता है कि फ़ाइल मान्य xls फ़ाइल न हो।"
"BIFF8 Globals BOF record not found; the file may be corrupted.": "BIFF8 Globals BOF रिकॉर्ड नहीं मिला; हो सकता है कि फ़ाइल खराब हो।"
"The range must be in A1:F1 format.": "श्रेणी A1:F1 प्रारूप में होनी चाहिए।"
"The rich-text segments cannot be empty.": "रिच-टेक्स्ट खंड खाली नहीं हो सकते।"
"No output location was specified.": "कोई आउटपुट स्थान निर्दिष्ट नहीं किया गया।"
"Source data has not been set; call SetSourceData() first.": "स्रोत डेटा सेट नहीं किया गया है; पहले SetSourceData() कॉल करें।"
"The stream content cannot be recognized or the format is not supported.": "स्ट्रीम सामग्री पहचानी नहीं जा सकती या प्रारूप समर्थित नहीं है।"
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "PDF पृष्ठों को छवियों में रेंडर करने के लिए रेंडरिंग लाइब्रेरी आवश्यक है, जिसे यह संस्करण समर्थित नहीं करता।"
"The signature field is missing the /Contents placeholder.": "हस्ताक्षर फ़ील्ड में /Contents प्लेसहोल्डर अनुपस्थित है।"
"The /Contents placeholder is malformed.": "/Contents प्लेसहोल्डर विकृत है।"
"The certificate does not contain a usable RSA private key.": "प्रमाणपत्र में उपयोग योग्य RSA निजी कुंजी नहीं है।"
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "PowerPoint दस्तावेज़ स्ट्रीम नहीं मिली; हो सकता है कि फ़ाइल मान्य .ppt फ़ाइल न हो।"
