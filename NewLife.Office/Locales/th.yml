# ไทย 词表（th）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "ไม่พบสตรีมสมุดงาน ไฟล์อาจไม่ใช่ไฟล์ xls ที่ถูกต้อง"
"BIFF8 Globals BOF record not found; the file may be corrupted.": "ไม่พบบันทึก BIFF8 Globals BOF ไฟล์อาจเสียหาย"
"The range must be in A1:F1 format.": "ช่วงต้องอยู่ในรูปแบบ A1:F1"
"The rich-text segments cannot be empty.": "ส่วนของข้อความที่มีการจัดรูปแบบต้องไม่ว่างเปล่า"
"No output location was specified.": "ไม่ได้ระบุตำแหน่งเอาต์พุต"
"Source data has not been set; call SetSourceData() first.": "ยังไม่ได้ตั้งค่าข้อมูลต้นทาง โปรดเรียก SetSourceData() ก่อน"
"The stream content cannot be recognized or the format is not supported.": "ไม่สามารถจดจำเนื้อหาของสตรีมหรือไม่รองรับรูปแบบนี้"
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "การเรนเดอร์หน้า PDF เป็นรูปภาพต้องใช้ไลบรารีการเรนเดอร์ ซึ่งเวอร์ชันนี้ไม่รองรับ"
"The signature field is missing the /Contents placeholder.": "ฟิลด์ลายเซ็นไม่มีตัวยึดตำแหน่ง /Contents"
"The /Contents placeholder is malformed.": "ตัวยึดตำแหน่ง /Contents อยู่ในรูปแบบที่ไม่ถูกต้อง"
"The certificate does not contain a usable RSA private key.": "ใบรับรองไม่มีคีย์ส่วนตัว RSA ที่ใช้งานได้"
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "ไม่พบสตรีมเอกสาร PowerPoint ไฟล์อาจไม่ใช่ไฟล์ .ppt ที่ถูกต้อง"
