# فارسی 词表（fa）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "جریان کتاب کار یافت نشد؛ ممکن است فایل یک فایل xls معتبر نباشد."
"BIFF8 Globals BOF record not found; the file may be corrupted.": "رکورد BIFF8 Globals BOF یافت نشد؛ ممکن است فایل خراب باشد."
"The range must be in A1:F1 format.": "محدوده باید در قالب A1:F1 باشد."
"The rich-text segments cannot be empty.": "بخش‌های متن غنی نمی‌توانند خالی باشند."
"No output location was specified.": "هیچ مکان خروجی مشخص نشده است."
"Source data has not been set; call SetSourceData() first.": "داده‌های منبع تنظیم نشده است؛ ابتدا SetSourceData() را فراخوانی کنید."
"The stream content cannot be recognized or the format is not supported.": "محتوای جریان قابل شناسایی نیست یا قالب پشتیبانی نمی‌شود."
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "رندر صفحات PDF به تصویر نیاز به کتابخانه رندر دارد که این نسخه از آن پشتیبانی نمی‌کند."
"The signature field is missing the /Contents placeholder.": "فیلد امضا فاقد جایگزین /Contents است."
"The /Contents placeholder is malformed.": "جایگزین /Contents بدشکل است."
"The certificate does not contain a usable RSA private key.": "گواهی شامل کلید خصوصی RSA قابل استفاده نیست."
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "جریان سند PowerPoint یافت نشد؛ ممکن است فایل یک فایل .ppt معتبر نباشد."
# 以下为新增运行时消息；暂以英文回退，待增量翻译。
"File not found: {0}": "فایل یافت نشد: {0}"
"The stream content cannot be recognized or the format is not supported: {0}": "محتوای جریان شناسایی نشد یا قالب پشتیبانی نمی‌شود: {0}"
"The text is too long ({0} bytes); the maximum is 106 bytes. Please shorten the text.": "متن بیش از حد طولانی است ({0} بایت)؛ حداکثر 106 بایت است. لطفاً متن را کوتاه کنید."
"Signature field '{0}' was not found.": "فیلد امضا «{0}» یافت نشد."
"Signature length {0} exceeds the reserved {1} characters.": "طول امضا {0} از {1} کاراکتر رزروشده فراتر می‌رود."
"Slide index {0} is out of range (total {1} slides).": "شاخص اسلاید {0} خارج از محدوده است (مجموع {1} اسلاید)."
"The number of persisted objects {0} exceeds the per-block persistence directory limit of 4095.": "تعداد اشیای ماندگار {0} از حد 4095 دایرکتوری ماندگاری در هر بلوک فراتر می‌رود."
"Image index {0} is out of range (total {1} images).": "شاخص تصویر {0} خارج از محدوده است (مجموع {1} تصویر)."
"Slide {0} does not exist in the source file.": "اسلاید {0} در فایل مبدأ وجود ندارد."
"The encrypted PPTX requires an open password.": "فایل PPTX رمزگذاری‌شده به رمز عبور باز کردن نیاز دارد."
"Slide {0} does not exist.": "اسلاید {0} وجود ندارد."
"WordDocument stream not found; the file may not be a valid .doc file.": "جریان WordDocument یافت نشد؛ ممکن است فایل یک .doc معتبر نباشد."
"Unsupported document format: wIdent = 0x{0:X4}. Only Word 97-2003 binary format is supported.": "قالب سند پشتیبانی نمی‌شود: wIdent = 0x{0:X4}. فقط قالب باینری Word 97-2003 پشتیبانی می‌شود."
"The EncryptionInfo stream is missing from the CFB container.": "جریان EncryptionInfo در محفظه CFB وجود ندارد."
