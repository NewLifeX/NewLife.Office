# Tiếng Việt 词表（vi）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "Không tìm thấy luồng sổ làm việc; tệp có thể không phải là tệp xls hợp lệ."
"BIFF8 Globals BOF record not found; the file may be corrupted.": "Không tìm thấy bản ghi BIFF8 Globals BOF; tệp có thể bị hỏng."
"The range must be in A1:F1 format.": "Phạm vi phải ở định dạng A1:F1."
"The rich-text segments cannot be empty.": "Các phân đoạn văn bản định dạng không được để trống."
"No output location was specified.": "Chưa chỉ định vị trí đầu ra."
"Source data has not been set; call SetSourceData() first.": "Dữ liệu nguồn chưa được đặt; hãy gọi SetSourceData() trước."
"The stream content cannot be recognized or the format is not supported.": "Không thể nhận dạng nội dung luồng hoặc định dạng không được hỗ trợ."
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "Kết xuất trang PDF thành hình ảnh yêu cầu thư viện kết xuất, mà phiên bản này không hỗ trợ."
"The signature field is missing the /Contents placeholder.": "Trường chữ ký thiếu phần giữ chỗ /Contents."
"The /Contents placeholder is malformed.": "Phần giữ chỗ /Contents không hợp lệ."
"The certificate does not contain a usable RSA private key.": "Chứng chỉ không chứa khóa riêng RSA có thể sử dụng."
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "Không tìm thấy luồng tài liệu PowerPoint; tệp có thể không phải là tệp .ppt hợp lệ."
