# Magyar 词表（hu）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "A munkafüzet streame nem található; a fájl esetleg nem érvényes xls-fájl."
"BIFF8 Globals BOF record not found; the file may be corrupted.": "A BIFF8 Globals BOF rekord nem található; a fájl esetleg sérült."
"The range must be in A1:F1 format.": "A tartománynak A1:F1 formátumúnak kell lennie."
"The rich-text segments cannot be empty.": "A formázott szöveg szegmensei nem lehetnek üresek."
"No output location was specified.": "Nem lett megadva kimeneti hely."
"Source data has not been set; call SetSourceData() first.": "A forrásadatok nincsenek beállítva; először hívja meg a SetSourceData() metódust."
"The stream content cannot be recognized or the format is not supported.": "A stream tartalma nem ismerhető fel, vagy a formátum nem támogatott."
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "A PDF-oldalak képekké alakításához renderelőkönyvtár szükséges, amelyet ez a verzió nem támogat."
"The signature field is missing the /Contents placeholder.": "Az aláírásmezőből hiányzik a /Contents helyőrző."
"The /Contents placeholder is malformed.": "A /Contents helyőrző formátuma helytelen."
"The certificate does not contain a usable RSA private key.": "A tanúsítvány nem tartalmaz használható RSA titkos kulcsot."
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "A PowerPoint-dokumentum streame nem található; a fájl esetleg nem érvényes .ppt-fájl."
