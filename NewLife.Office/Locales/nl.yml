# Nederlands 词表（nl）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "Werkmapstream niet gevonden; het bestand is mogelijk geen geldig xls-bestand."
"BIFF8 Globals BOF record not found; the file may be corrupted.": "BIFF8 Globals BOF-record niet gevonden; het bestand is mogelijk beschadigd."
"The range must be in A1:F1 format.": "Het bereik moet de indeling A1:F1 hebben."
"The rich-text segments cannot be empty.": "De rich-textsegmenten mogen niet leeg zijn."
"No output location was specified.": "Er is geen uitvoerlocatie opgegeven."
"Source data has not been set; call SetSourceData() first.": "Brongegevens zijn niet ingesteld; roep eerst SetSourceData() aan."
"The stream content cannot be recognized or the format is not supported.": "De streaminhoud kan niet worden herkend of de indeling wordt niet ondersteund."
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "Het weergeven van PDF-pagina's als afbeeldingen vereist een weergavebibliotheek, die deze versie niet ondersteunt."
"The signature field is missing the /Contents placeholder.": "In het handtekeningveld ontbreekt de tijdelijke aanduiding /Contents."
"The /Contents placeholder is malformed.": "De tijdelijke aanduiding /Contents is ongeldig."
"The certificate does not contain a usable RSA private key.": "Het certificaat bevat geen bruikbare RSA-privésleutel."
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "PowerPoint-documentstream niet gevonden; het bestand is mogelijk geen geldig .ppt-bestand."
