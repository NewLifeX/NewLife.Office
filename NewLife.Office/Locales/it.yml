# Italiano 词表（it）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "Flusso della cartella di lavoro non trovato; il file potrebbe non essere un file xls valido."
"BIFF8 Globals BOF record not found; the file may be corrupted.": "Record BIFF8 Globals BOF non trovato; il file potrebbe essere danneggiato."
"The range must be in A1:F1 format.": "L'intervallo deve essere nel formato A1:F1."
"The rich-text segments cannot be empty.": "I segmenti di testo formattato non possono essere vuoti."
"No output location was specified.": "Non è stata specificata una posizione di output."
"Source data has not been set; call SetSourceData() first.": "I dati di origine non sono stati impostati; chiamare prima SetSourceData()."
"The stream content cannot be recognized or the format is not supported.": "Il contenuto del flusso non può essere riconosciuto o il formato non è supportato."
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "Il rendering delle pagine PDF in immagini richiede una libreria di rendering, che questa versione non supporta."
"The signature field is missing the /Contents placeholder.": "Nel campo firma manca il segnaposto /Contents."
"The /Contents placeholder is malformed.": "Il segnaposto /Contents non è valido."
"The certificate does not contain a usable RSA private key.": "Il certificato non contiene una chiave privata RSA utilizzabile."
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "Flusso del documento PowerPoint non trovato; il file potrebbe non essere un file .ppt valido."
