# Deutsch 词表（de）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "Workbook-Stream nicht gefunden; die Datei ist möglicherweise keine gültige xls-Datei."
"BIFF8 Globals BOF record not found; the file may be corrupted.": "BIFF8-Globals-BOF-Datensatz nicht gefunden; die Datei ist möglicherweise beschädigt."
"The range must be in A1:F1 format.": "Der Bereich muss im Format A1:F1 angegeben werden."
"The rich-text segments cannot be empty.": "Die Rich-Text-Segmente dürfen nicht leer sein."
"No output location was specified.": "Es wurde kein Ausgabeort angegeben."
"Source data has not been set; call SetSourceData() first.": "Quelldaten wurden nicht festgelegt; rufen Sie zuerst SetSourceData() auf."
"The stream content cannot be recognized or the format is not supported.": "Der Streaminhalt kann nicht erkannt werden, oder das Format wird nicht unterstützt."
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "Das Rendern von PDF-Seiten in Bilder erfordert eine Renderingbibliothek, die diese Version nicht unterstützt."
"The signature field is missing the /Contents placeholder.": "Im Signaturfeld fehlt der Platzhalter /Contents."
"The /Contents placeholder is malformed.": "Der Platzhalter /Contents ist fehlerhaft."
"The certificate does not contain a usable RSA private key.": "Das Zertifikat enthält keinen verwendbaren privaten RSA-Schlüssel."
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "PowerPoint-Document-Stream nicht gefunden; die Datei ist möglicherweise keine gültige .ppt-Datei."
