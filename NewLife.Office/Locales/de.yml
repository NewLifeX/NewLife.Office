# Deutsch 词表（de）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "Workbook-Stream nicht gefunden; die Datei ist möglicherweise keine gültige xls-Datei."
