# Français 词表（fr）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "Flux de classeur introuvable ; le fichier n'est peut-être pas un fichier xls valide."
"BIFF8 Globals BOF record not found; the file may be corrupted.": "Enregistrement BIFF8 Globals BOF introuvable ; le fichier est peut-être corrompu."
"The range must be in A1:F1 format.": "La plage doit être au format A1:F1."
"The rich-text segments cannot be empty.": "Les segments de texte enrichi ne peuvent pas être vides."
"No output location was specified.": "Aucun emplacement de sortie n'a été spécifié."
"Source data has not been set; call SetSourceData() first.": "Les données sources n'ont pas été définies ; appelez d'abord SetSourceData()."
"The stream content cannot be recognized or the format is not supported.": "Le contenu du flux ne peut pas être reconnu ou le format n'est pas pris en charge."
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "Le rendu des pages PDF en images nécessite une bibliothèque de rendu, que cette version ne prend pas en charge."
"The signature field is missing the /Contents placeholder.": "Le champ de signature ne contient pas l'espace réservé /Contents."
"The /Contents placeholder is malformed.": "L'espace réservé /Contents est mal formé."
"The certificate does not contain a usable RSA private key.": "Le certificat ne contient pas de clé privée RSA utilisable."
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "Flux de document PowerPoint introuvable ; le fichier n'est peut-être pas un fichier .ppt valide."
