# Русский 词表（ru）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Workbook stream not found; the file may not be a valid xls file.": "Поток книги не найден; возможно, файл не является допустимым xls-файлом."
"BIFF8 Globals BOF record not found; the file may be corrupted.": "Запись BIFF8 Globals BOF не найдена; возможно, файл повреждён."
"The range must be in A1:F1 format.": "Диапазон должен быть в формате A1:F1."
"The rich-text segments cannot be empty.": "Сегменты форматированного текста не могут быть пустыми."
"No output location was specified.": "Не указано место вывода."
"Source data has not been set; call SetSourceData() first.": "Исходные данные не заданы; сначала вызовите SetSourceData()."
"The stream content cannot be recognized or the format is not supported.": "Содержимое потока не распознаётся или формат не поддерживается."
"Rendering PDF pages to images requires a rendering library, which this version does not support.": "Для преобразования страниц PDF в изображения требуется библиотека отрисовки, которая не поддерживается в этой версии."
"The signature field is missing the /Contents placeholder.": "В поле подписи отсутствует заполнитель /Contents."
"The /Contents placeholder is malformed.": "Заполнитель /Contents имеет неверный формат."
"The certificate does not contain a usable RSA private key.": "Сертификат не содержит пригодного закрытого ключа RSA."
"PowerPoint Document stream not found; the file may not be a valid .ppt file.": "Поток документа PowerPoint не найден; возможно, файл не является допустимым .ppt-файлом."
