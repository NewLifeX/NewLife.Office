"Workbook stream not found; the file may not be a valid xls file.": "Aliran buku kerja tidak ditemui; fail mungkin bukan fail xls yang sah."
"BIFF8 Globals BOF record not found; the file may be corrupted.": "Rekod BIFF8 Globals BOF tidak ditemui; fail mungkin rosak."
"The range must be in A1:F1 format.": "Julat mesti dalam format A1:F1."
"The rich-text segments cannot be empty.": "Segmen teks kaya tidak boleh kosong."
"No output location was specified.": "Tiada lokasi output dinyatakan."
"Source data has not been set; call SetSourceData() first.": "Data sumber belum ditetapkan; panggil SetSourceData() terlebih dahulu."
"The stream content cannot be recognized or the format is not supported.": "Kandungan aliran tidak dapat dikenali atau format tidak disokong."
