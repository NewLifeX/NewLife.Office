name: test

# 单元测试矩阵：win-x64 / linux-x64 / linux-arm64 / linux-la64（龙芯，必选覆盖）+ osx-arm64 / win-arm64（观察期）。
# 触发：push / pull_request / 手动（workflow_dispatch）；不采用夜间定时（多代码库服务端同步周期长）。
# 参考 NewLife.XCode/NewLife.Redis：linux-x64 为阻断基线；win-x64 / linux-arm64 用原生 runner；
# linux-la64 无托管 runner，经 QEMU 用户态仿真 + 龙芯 .NET SDK（github.com/loongson/dotnet）+ loong64 Debian 容器运行，
# 宿主 x64 完成构建（QEMU 内不跑 MSBuild），VSTest 不支持 LoongArch64，容器内改用 xunit 控制台运行器。

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 阻断基线：全量编译 + linux-x64 单元测试（既定门禁）
  build-publish:

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Build
      run: |
        dotnet build -c Release --nologo
    - name: Test
      run: |
        dotnet test -c Release XUnitTest/XUnitTest.csproj --no-build --nologo \
          --blame-hang-timeout 20m \
          --logger "trx;LogFileName=test-linux-x64.trx" --results-directory TestResults
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-linux-x64
        path: TestResults/**
        if-no-files-found: ignore

  # win-x64 / linux-arm64：原生 runner 直接运行（首次失败自动以 --no-build 重试一次，抵御偶发环境抖动）。
  # osx-arm64 / win-arm64：观察期，稳定全绿后转阻断。
  test:
    name: test (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-arm64
            os: macos-latest
            experimental: true
          - rid: win-arm64
            os: windows-11-arm
            experimental: true

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Test（${{ matrix.rid }}）
      shell: bash
      run: |
        if ! dotnet test XUnitTest/XUnitTest.csproj -c Release --nologo \
          --blame-hang-timeout 20m \
          --logger "trx;LogFileName=test-${{ matrix.rid }}.trx" --results-directory TestResults; then
          echo "首次失败，以 --no-build 重试一次"
          dotnet test XUnitTest/XUnitTest.csproj -c Release --no-build --nologo \
            --blame-hang-timeout 20m \
            --logger "trx;LogFileName=test-${{ matrix.rid }}-retry.trx" --results-directory TestResults
        fi
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.rid }}
        path: TestResults/**
        if-no-files-found: ignore

  # linux-la64（龙芯，必选覆盖）：QEMU 用户态仿真 + 龙芯 SDK + loong64 Debian 容器。
  # 宿主 x64 预构建测试程序集；容器内独立系统无原生 ICU，以 invariant 模式运行。
  # 非阻塞：仿真链路不稳定时允许失败跳过，不阻塞主干（LA64 为兼容性覆盖，非发布门禁）
  test-linux-la64:
    name: test (linux-la64 / QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET (host，用于预热 NuGet 缓存)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Build for loong64 (host，QEMU 内不跑 MSBuild)
      run: dotnet build XUnitTest/XUnitTest.csproj -c Release --nologo
    - name: Download xunit console runner (host，VSTest 不支持 LoongArch64)
      run: |
        curl -fsSL -o "$RUNNER_TEMP/xrc.nupkg" https://api.nuget.org/v3-flatcontainer/xunit.runner.console/2.9.3/xunit.runner.console.2.9.3.nupkg
        mkdir -p "$HOME/xrc"
        unzip -oj "$RUNNER_TEMP/xrc.nupkg" "tools/net6.0/*" -d "$HOME/xrc"
        ls "$HOME/xrc"
    - name: Download Loongson .NET SDK (linux-loongarch64)
      run: |
        curl -fL --retry 3 -o "$RUNNER_TEMP/la64-sdk.tar.gz" \
          https://github.com/loongson/dotnet/releases/download/v10.0.113-loongarch64/dotnet-sdk-10.0.113-linux-loongarch64.tar.gz
        mkdir -p "$HOME/la64" && tar -xzf "$RUNNER_TEMP/la64-sdk.tar.gz" -C "$HOME/la64"
        ls "$HOME/la64" | head -20
    - name: Install QEMU loong64 binfmt
      run: docker run --privileged --rm ghcr.io/loong64/binfmt --install all
    - name: Unit Tests (loong64 container)
      run: |
        docker run --rm --platform linux/loong64 -w /src \
          -v "$PWD:/src" -v "$HOME/la64:/opt/dotnet:ro" -v "$HOME/.nuget:/home/runner/.nuget" -v "$HOME/xrc:/opt/xunit:ro" \
          -e HOME=/home/runner -e DOTNET_CLI_HOME=/home/runner -e NUGET_PACKAGES=/home/runner/.nuget/packages \
          -e DOTNET_ROOT=/opt/dotnet -e PATH=/opt/dotnet:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 -e DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 \
          -e DOTNET_ROLL_FORWARD=LatestMajor -e DOTNET_EnableWriteXorExecute=0 \
          ghcr.io/loong64/debian:trixie bash -c '
            set -e
            apt-get update -qq || true
            apt-get install -y -qq ca-certificates libstdc++6 zlib1g libunwind8 || true
            apt-get install -y -qq libssl3t64 || apt-get install -y -qq libssl3 || true
            # SkiaSharp Linux 原生库依赖 fontconfig/freetype
            apt-get install -y -qq libfontconfig1 fonts-dejavu-core || true
            LIBDIR=$(ls -d /usr/lib/*-linux-gnu* 2>/dev/null | head -1)
            export LD_LIBRARY_PATH="$LIBDIR:$LD_LIBRARY_PATH"
            dotnet --info
            # 把 xunit 控制台运行器放入测试输出目录，作为入口程序集保证 BaseDirectory 与 dotnet test 一致
            cp /opt/xunit/* /src/Bin/UnitTest/
            # xunit 控制台入口的 deps.json 不含测试程序集的原生依赖，把目标 RID 原生库摊平到输出目录
            if [ -d /src/Bin/UnitTest/runtimes/linux-loongarch64/native ]; then
              cp -f /src/Bin/UnitTest/runtimes/linux-loongarch64/native/* /src/Bin/UnitTest/ || true
            fi
            mkdir -p /src/TestResults
            cd /src/Bin/UnitTest
            timeout 300m dotnet xunit.console.dll XUnitTest.dll \
              -parallel none \
              -xml /src/TestResults/test-linux-la64.xml
          '
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-linux-la64
        path: |
          TestResults/*.trx
          TestResults/*.xml
        if-no-files-found: ignore


  localization:
    name: localization checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    - name: Check locales
      shell: pwsh
      run: |
        $failed = $false
        Get-ChildItem -Path . -Recurse -Directory -Filter Locales | ForEach-Object {
          if (Test-Path (Join-Path $_.FullName 'zh-Hans.yml')) {
            $src = Split-Path $_.FullName -Parent
            pwsh -File ./check-locales.ps1 -LocaleDir $_.FullName -Baseline zh-Hans.yml -SourceDir $src
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
        }
        if ($failed) { exit 1 }
    - name: Check README languages
      shell: pwsh
      run: pwsh -File ./sync-readme-languages.ps1 -Check
